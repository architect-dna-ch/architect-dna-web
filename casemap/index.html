<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Map</title>
<style>
:root{
  --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
  --paper:#f2ede2;
  --paper-dark:#e8e0cf;
  --ink:#201d17;
  --ink-soft:#5a5648;
  --red:#a3231f;
  --gold:#8a6d1f;
  --teal:#2e4a44;
  --grey:#8a8578;
  --line:#c9beaa;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-serif);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

header{
  border-bottom:3px double var(--ink);
  padding:20px 24px 14px;
  flex-shrink:0;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--ink-soft);
  text-transform:uppercase;
}
h1{
  font-size:28px;
  font-weight:700;
  margin-top:2px;
}
h1 span{color:var(--red);}

.toprow{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
.actions{display:flex; gap:8px; flex-shrink:0; margin-top:2px;}
.actions button{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:8px 14px;
  cursor:pointer;
}
.actions button.secondary{background:transparent; color:var(--ink);}
.actions button:hover{opacity:0.8;}

.filters{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}
.filters button{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border:1px solid var(--ink-soft);
  background:transparent;
  color:var(--ink-soft);
  padding:7px 12px;
  cursor:pointer;
}
.filters button.active{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
}
.filters button:hover{border-color:var(--ink); color:var(--ink);}
.filters button.active:hover{color:var(--paper);}

main{
  flex:1;
  display:flex;
  overflow:hidden;
}

#graph{
  flex:1;
  overflow:auto;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.015) 3px);
}

#sidebar{
  width:360px;
  flex-shrink:0;
  border-left:1px solid var(--ink);
  background:var(--paper-dark);
  padding:22px;
  overflow-y:auto;
}
#sidebar .placeholder{
  color:var(--ink-soft);
  font-style:italic;
  font-size:14px;
}

.doc-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:6px;
}
.doc-meta{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-bottom:14px;
}
.doc-status{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:4px 9px;
  border:2px solid;
  transform:rotate(-2deg);
  margin-bottom:16px;
}
.doc-status.sent{color:var(--teal); border-color:var(--teal);}
.doc-status.ready{color:var(--gold); border-color:var(--gold);}
.doc-status.draft{color:var(--grey); border-color:var(--grey); transform:rotate(0);}
.doc-status.blocked{color:var(--red); border-color:var(--red);}

.doc-deadline{
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:700;
  padding:6px 10px;
  margin-bottom:14px;
  border-left:3px solid var(--red);
  background:rgba(163,35,31,0.08);
}
.doc-deadline.ok{border-left-color:var(--teal); background:rgba(46,74,68,0.08);}
.doc-deadline.soon{border-left-color:var(--gold); background:rgba(138,109,31,0.08);}

.doc-section{margin-top:16px;}
.doc-section h3{
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  border-bottom:1px solid var(--line);
  padding-bottom:5px;
  margin-bottom:8px;
}
.doc-section p{font-size:14px; line-height:1.6;}
.doc-section ul{margin-left:16px; font-size:13px; line-height:1.7;}
.doc-section li{cursor:pointer;}
.doc-section li:hover{color:var(--red);}

.legend{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--ink-soft);
}
.legend div{margin-bottom:5px; display:flex; align-items:center; gap:6px;}
.legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

/* Edit form */
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.field input, .field select, .field textarea{
  width:100%;
  font-family:var(--font-serif);
  font-size:14px;
  padding:7px 8px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:8px;}
.field-row .field{flex:1;}
.form-actions{display:flex; gap:8px; margin-top:16px;}
.form-actions button{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border:1px solid var(--ink);
  padding:8px 14px;
  cursor:pointer;
  background:var(--ink);
  color:var(--paper);
}
.form-actions button.secondary{background:transparent; color:var(--ink);}
.form-actions button.danger{background:var(--red); border-color:var(--red); color:var(--paper);}

.edit-link{
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  color:var(--ink-soft);
  cursor:pointer;
  text-decoration:underline;
  margin-left:8px;
}
.edit-link:hover{color:var(--red);}

/* Deadline list view */
.deadline-list{padding:20px 24px; overflow-y:auto; height:100%;}
.deadline-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  border:1px solid var(--line);
  background:var(--paper-dark);
  margin-bottom:8px;
  cursor:pointer;
}
.deadline-row:hover{border-color:var(--ink);}
.deadline-date{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:700;
  width:100px;
  flex-shrink:0;
}
.deadline-date.overdue{color:var(--red);}
.deadline-date.soon{color:var(--gold);}
.deadline-title{flex:1; font-size:14px;}
.deadline-recipient{
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
}
.deadline-empty{color:var(--ink-soft); font-style:italic; font-size:14px; padding:20px;}

</style>
</head>
<body>

const STORAGE_KEY = 'casemap_docs_v1';

let docsById = {};
let activeFilter = 'all';
let positions = {};
let currentView = 'graph';

const STATUS_COLOR = {
  draft:   '#8a8578',
  ready:   '#c9a13a',
  sent:    '#3f6b62',
  blocked: '#c1443e'
};
const STATUS_LABEL = { draft:'Entwurf', ready:'Bereit', sent:'Gesendet', blocked:'Blockiert' };

function loadDocs(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { return JSON.parse(saved); } catch(e) { /* fall through */ }
  }
  return DEFAULT_DOCS;
}

function saveDocs(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.values(docsById)));
}

function init(docs){
  docsById = {};
  docs.forEach(d => docsById[d.id] = d);
  rebuildFilters();
  layoutByRecipient();
  render();
}

function rebuildFilters(){
  const docs = Object.values(docsById);
  const recipients = [...new Set(docs.map(d => d.recipient))];
  const container = document.getElementById('filters');
  container.innerHTML = '';
  container.appendChild(makeFilterBtn('Alle', 'all', activeFilter === 'all'));
  recipients.forEach(r => container.appendChild(makeFilterBtn(r, r, activeFilter === r)));
}

function makeFilterBtn(label, value, active){
  const btn = document.createElement('button');
  btn.textContent = label;
  if (active) btn.classList.add('active');
  btn.onclick = () => {
    activeFilter = value;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  return btn;
}

// Simple deterministic layout: group nodes into columns by recipient,
// stack vertically within each column.
function layoutByRecipient(){
  const docs = Object.values(docsById);
  const recipients = [...new Set(docs.map(d => d.recipient))];
  const colWidth = 220;
  const rowHeight = 90;
  const startX = 130;
  const startY = 90;

  positions = {};
  recipients.forEach((r, colIdx) => {
    const docsInCol = docs.filter(d => d.recipient === r);
    docsInCol.forEach((d, rowIdx) => {
      positions[d.id] = {
        x: startX + colIdx * colWidth,
        y: startY + rowIdx * rowHeight,
        col: r
      };
    });
  });
}

function render(){
  if (currentView !== 'graph') return;
  const graph = document.getElementById('graph');
  graph.innerHTML = '';

  const visibleDocs = Object.values(docsById).filter(d =>
    activeFilter === 'all' || d.recipient === activeFilter
  );
  const visibleIds = new Set(visibleDocs.map(d => d.id));

  if (visibleDocs.length === 0) {
    graph.innerHTML = '<div style="padding:40px; color:#8a8578; font-style:italic;">Keine Dokumente.</div>';
    return;
  }

  const maxX = Math.max(...visibleDocs.map(d => positions[d.id].x)) + 200;
  const maxY = Math.max(...visibleDocs.map(d => positions[d.id].y)) + 100;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"></path>
  </marker>`;
  svg.appendChild(defs);

  const seenCols = new Set();
  visibleDocs.forEach(d => {
    const pos = positions[d.id];
    if (!seenCols.has(pos.col)) {
      seenCols.add(pos.col);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', pos.x + 85);
      label.setAttribute('y', 40);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-family', 'JetBrains Mono, monospace');
      label.setAttribute('font-size', '11');
      label.setAttribute('fill', '#5a5648');
      label.setAttribute('letter-spacing', '1.5');
      label.textContent = pos.col.toUpperCase();
      svg.appendChild(label);
    }
  });

  visibleDocs.forEach(d => {
    (d.references || []).forEach(refId => {
      if (visibleIds.has(refId) && positions[refId]) {
        const from = positions[refId];
        const to = positions[d.id];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = from.x + 85, y1 = from.y + 30;
        const x2 = to.x + 85, y2 = to.y;
        const midY = (y1 + y2) / 2;
        path.setAttribute('d', `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`);
        path.setAttribute('stroke', '#8a8578');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('opacity', '0.7');
        path.setAttribute('marker-end', 'url(#arrow)');
        svg.appendChild(path);
      }
    });
  });

  visibleDocs.forEach(d => {
    const pos = positions[d.id];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    g.style.cursor = 'pointer';
    g.onclick = () => showDetail(d.id);

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', '170');
    rect.setAttribute('height', '54');
    rect.setAttribute('rx', '2');
    rect.setAttribute('fill', STATUS_COLOR[d.status]);
    rect.setAttribute('stroke', '#201d17');
    rect.setAttribute('stroke-width', '1.5');
    g.appendChild(rect);

    if (d.deadline && isOverdue(d.deadline)) {
      const flag = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      flag.setAttribute('cx', '164');
      flag.setAttribute('cy', '6');
      flag.setAttribute('r', '5');
      flag.setAttribute('fill', '#a3231f');
      flag.setAttribute('stroke', '#f2ede2');
      flag.setAttribute('stroke-width', '1');
      g.appendChild(flag);
    }

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', '10');
    text.setAttribute('y', '22');
    text.setAttribute('font-family', "'Source Serif 4', serif");
    text.setAttribute('font-size', '12.5');
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', '#f2ede2');
    wrapText(text, d.title, 150, 15);
    g.appendChild(text);

    const dateText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    dateText.setAttribute('x', '10');
    dateText.setAttribute('y', '46');
    dateText.setAttribute('font-family', 'JetBrains Mono, monospace');
    dateText.setAttribute('font-size', '9.5');
    dateText.setAttribute('fill', '#f2ede2');
    dateText.setAttribute('opacity', '0.85');
    dateText.textContent = d.date;
    g.appendChild(dateText);

    svg.appendChild(g);
  });

  graph.appendChild(svg);
}

function wrapText(textEl, str, maxWidth, lineHeight){
  const words = str.split(' ');
  let line = '';
  let lines = [];
  const approxCharWidth = 6.3;
  const maxChars = Math.floor(maxWidth / approxCharWidth);

  words.forEach(w => {
    if ((line + ' ' + w).trim().length > maxChars) {
      lines.push(line.trim());
      line = w;
    } else {
      line = (line + ' ' + w).trim();
    }
  });
  if (line) lines.push(line);
  lines = lines.slice(0, 2);

  lines.forEach((l, i) => {
    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    tspan.setAttribute('x', '10');
    tspan.setAttribute('dy', i === 0 ? '0' : lineHeight);
    tspan.textContent = l;
    textEl.appendChild(tspan);
  });
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function isOverdue(dateStr){ return daysUntil(dateStr) < 0; }
function isSoon(dateStr){ const d = daysUntil(dateStr); return d >= 0 && d <= 7; }

function deadlineBadge(dateStr){
  if (!dateStr) return '';
  const days = daysUntil(dateStr);
  let cls = 'ok', text = `noch ${days} Tage`;
  if (days < 0) { cls = ''; text = `überfällig seit ${Math.abs(days)} Tagen`; }
  else if (days === 0) { cls = 'soon'; text = 'heute fällig'; }
  else if (days <= 7) { cls = 'soon'; text = `noch ${days} Tage`; }
  return `<div class="doc-deadline ${cls}">Frist: ${dateStr} — ${text}</div>`;
}

function showDetail(id){
  const d = docsById[id];
  const sidebar = document.getElementById('sidebar');

  const refsHtml = (d.references || []).length
    ? `<ul>${d.references.map(r => `<li onclick="showDetail('${r}')">${docsById[r] ? docsById[r].title : r}</li>`).join('')}</ul>`
    : `<p style="color:#8a8578; font-style:italic;">Keine Referenzen.</p>`;

  const attHtml = (d.attachments || []).length
    ? `<ul>${d.attachments.map(a => `<li style="cursor:default;">${a}</li>`).join('')}</ul>`
    : `<p style="color:#8a8578; font-style:italic;">Keine Beilagen erfasst.</p>`;

  sidebar.innerHTML = `
    <div class="doc-title">${d.title} <span class="edit-link" onclick="showEditForm('${d.id}')">Bearbeiten</span></div>
    <div class="doc-meta">${d.recipient} · ${d.date}</div>
    <div class="doc-status ${d.status}">${STATUS_LABEL[d.status]}</div>
    ${deadlineBadge(d.deadline)}
    <div class="doc-section">
      <h3>Zusammenfassung</h3>
      <p>${d.summary}</p>
    </div>
    <div class="doc-section">
      <h3>Referenziert</h3>
      ${refsHtml}
    </div>
    <div class="doc-section">
      <h3>Beilagen</h3>
      ${attHtml}
    </div>
    <div class="legend">
      <div><span class="dot" style="background:#3f6b62;"></span> Gesendet</div>
      <div><span class="dot" style="background:#c9a13a;"></span> Bereit</div>
      <div><span class="dot" style="background:#8a8578;"></span> Entwurf</div>
      <div><span class="dot" style="background:#c1443e;"></span> Blockiert</div>
    </div>
  `;
}

function showEditForm(id){
  const isNew = !id;
  const d = isNew
    ? { id: 'doc' + (Date.now()), title:'', recipient:'', status:'draft', date:new Date().toISOString().slice(0,10), deadline:'', references:[], attachments:[], summary:'' }
    : docsById[id];

  const allDocs = Object.values(docsById).filter(x => x.id !== d.id);
  const refOptions = allDocs.map(x =>
    `<option value="${x.id}" ${d.references.includes(x.id) ? 'selected' : ''}>${x.title}</option>`
  ).join('');

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = `
    <div class="doc-title">${isNew ? 'Neues Dokument' : 'Bearbeiten'}</div>
    <div class="field">
      <label>Titel</label>
      <input id="f-title" value="${escapeAttr(d.title)}">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Empfänger</label>
        <input id="f-recipient" value="${escapeAttr(d.recipient)}" placeholder="z.B. RSTA, Belp, MüB">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="draft" ${d.status==='draft'?'selected':''}>Entwurf</option>
          <option value="ready" ${d.status==='ready'?'selected':''}>Bereit</option>
          <option value="sent" ${d.status==='sent'?'selected':''}>Gesendet</option>
          <option value="blocked" ${d.status==='blocked'?'selected':''}>Blockiert</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Datum</label>
        <input id="f-date" type="date" value="${d.date}">
      </div>
      <div class="field">
        <label>Frist (optional)</label>
        <input id="f-deadline" type="date" value="${d.deadline || ''}">
      </div>
    </div>
    <div class="field">
      <label>Zusammenfassung</label>
      <textarea id="f-summary">${escapeHtml(d.summary)}</textarea>
    </div>
    <div class="field">
      <label>Beilagen (eine pro Zeile)</label>
      <textarea id="f-attachments">${(d.attachments||[]).join('\n')}</textarea>
    </div>
    <div class="field">
      <label>Referenziert (Mehrfachauswahl mit Cmd/Ctrl)</label>
      <select id="f-references" multiple size="4">${refOptions}</select>
    </div>
    <div class="form-actions">
      <button onclick="saveForm('${d.id}', ${isNew})">Speichern</button>
      <button class="secondary" onclick="${isNew ? 'showPlaceholder()' : `showDetail('${d.id}')`}">Abbrechen</button>
      ${isNew ? '' : `<button class="danger" onclick="deleteDoc('${d.id}')">Löschen</button>`}
    </div>
  `;
}

function escapeHtml(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function saveForm(id, isNew){
  const references = Array.from(document.getElementById('f-references').selectedOptions).map(o => o.value);
  const attachments = document.getElementById('f-attachments').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const doc = {
    id,
    title: document.getElementById('f-title').value.trim() || 'Ohne Titel',
    recipient: document.getElementById('f-recipient').value.trim() || 'Unbekannt',
    status: document.getElementById('f-status').value,
    date: document.getElementById('f-date').value,
    deadline: document.getElementById('f-deadline').value,
    references,
    attachments,
    summary: document.getElementById('f-summary').value.trim()
  };
  docsById[id] = doc;
  saveDocs();
  rebuildFilters();
  layoutByRecipient();
  render();
  renderDeadlines();
  showDetail(id);
}

function deleteDoc(id){
  if (!confirm('Dokument wirklich löschen?')) return;
  delete docsById[id];
  Object.values(docsById).forEach(d => {
    d.references = (d.references || []).filter(r => r !== id);
  });
  saveDocs();
  rebuildFilters();
  layoutByRecipient();
  render();
  renderDeadlines();
  showPlaceholder();
}

function showPlaceholder(){
  document.getElementById('sidebar').innerHTML = '<div class="placeholder">Auf einen Knoten klicken für Details.</div>';
}

function renderDeadlines(){
  const view = document.getElementById('deadlineView');
  const docs = Object.values(docsById).filter(d => d.deadline);
  docs.sort((a,b) => a.deadline.localeCompare(b.deadline));

  if (docs.length === 0) {
    view.innerHTML = '<div class="deadline-empty">Keine Fristen erfasst.</div>';
    return;
  }

  view.innerHTML = docs.map(d => {
    const days = daysUntil(d.deadline);
    const cls = days < 0 ? 'overdue' : (days <= 7 ? 'soon' : '');
    const label = days < 0 ? `−${Math.abs(days)}d` : `+${days}d`;
    return `
      <div class="deadline-row" onclick="switchView('graph'); showDetail('${d.id}')">
        <div class="deadline-date ${cls}">${d.deadline}<br><span style="font-size:10px;">${label}</span></div>
        <div>
          <div class="deadline-title">${d.title}</div>
          <div class="deadline-recipient">${d.recipient} · ${STATUS_LABEL[d.status]}</div>
        </div>
      </div>
    `;
  }).join('');
}

function switchView(view){
  currentView = view;
  document.getElementById('graph').style.display = view === 'graph' ? 'block' : 'none';
  document.getElementById('deadlineView').style.display = view === 'deadlines' ? 'block' : 'none';
  document.getElementById('btnGraphView').classList.toggle('secondary', view !== 'graph');
  document.getElementById('btnDeadlines').classList.toggle('secondary', view !== 'deadlines');
  if (view === 'graph') render();
  if (view === 'deadlines') renderDeadlines();
}

document.getElementById('btnNew').onclick = () => showEditForm(null);
document.getElementById('btnDeadlines').onclick = () => switchView('deadlines');
document.getElementById('btnGraphView').onclick = () => switchView('graph');

init(loadDocs());
  </script>
</body>
</html>

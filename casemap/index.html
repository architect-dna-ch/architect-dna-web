<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Map</title>
<style>
:root{
  --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
  --paper:#f2ede2;
  --paper-dark:#e8e0cf;
  --ink:#201d17;
  --ink-soft:#5a5648;
  --red:#a3231f;
  --gold:#8a6d1f;
  --teal:#2e4a44;
  --grey:#8a8578;
  --line:#c9beaa;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-serif);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

header{
  border-bottom:3px double var(--ink);
  padding:20px 24px 14px;
  flex-shrink:0;
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.14em;
  color:var(--ink-soft);
  text-transform:uppercase;
}
h1{
  font-size:28px;
  font-weight:700;
  margin-top:2px;
}
h1 span{color:var(--red);}

.filters{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}
.filters button{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.04em;
  border:1px solid var(--ink-soft);
  background:transparent;
  color:var(--ink-soft);
  padding:7px 12px;
  cursor:pointer;
}
.filters button.active{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
}
.filters button:hover{border-color:var(--ink); color:var(--ink);}
.filters button.active:hover{color:var(--paper);}

main{
  flex:1;
  display:flex;
  overflow:hidden;
}

#graph{
  flex:1;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px, rgba(0,0,0,0.015) 3px);
}

#sidebar{
  width:340px;
  flex-shrink:0;
  border-left:1px solid var(--ink);
  background:var(--paper-dark);
  padding:22px;
  overflow-y:auto;
}
#sidebar .placeholder{
  color:var(--ink-soft);
  font-style:italic;
  font-size:14px;
}

.doc-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:6px;
}
.doc-meta{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-bottom:14px;
}
.doc-status{
  display:inline-block;
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:4px 9px;
  border:2px solid;
  transform:rotate(-2deg);
  margin-bottom:16px;
}
.doc-status.sent{color:var(--teal); border-color:var(--teal);}
.doc-status.ready{color:var(--gold); border-color:var(--gold);}
.doc-status.draft{color:var(--grey); border-color:var(--grey); transform:rotate(0);}
.doc-status.blocked{color:var(--red); border-color:var(--red);}

.doc-section{margin-top:16px;}
.doc-section h3{
  font-family:var(--font-mono);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  border-bottom:1px solid var(--line);
  padding-bottom:5px;
  margin-bottom:8px;
}
.doc-section p{font-size:14px; line-height:1.6;}
.doc-section ul{margin-left:16px; font-size:13px; line-height:1.7;}
.doc-section li{cursor:pointer;}
.doc-section li:hover{color:var(--red);}

.legend{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--ink-soft);
}
.legend div{margin-bottom:5px; display:flex; align-items:center; gap:6px;}
.legend .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

</style>
</head>
<body>
  <header>
    <div class="eyebrow">Architect-DNA · Persönliches Übersichtstool</div>
    <h1>Case <span>Map</span></h1>
    <div class="filters" id="filters"></div>
  </header>

  <main>
    <div id="graph"></div>
    <aside id="sidebar">
      <div class="placeholder">Auf einen Knoten klicken für Details.</div>
    </aside>
  </main>

  <script>
const EMBEDDED_DOCS = [
  {
    "id": "doc1",
    "title": "Aufsichtsbeschwerde Belp",
    "recipient": "RSTA",
    "status": "sent",
    "date": "2026-07-07",
    "references": [],
    "attachments": ["11 Beschwerdepunkte"],
    "summary": "Aufsichtsbeschwerde an Gemeinderat Belp und Regierungsstatthalteramt Bern-Mittelland. 11 Punkte: unrechtmässige Zahlungsstopps, verweigerte Kautionshilfe, verweigerte SIL Handy/Laptop, verletztes rechtliches Gehör, unzulässiger Familienkontaktdruck trotz dokumentierter Bedrohungslage."
  },
  {
    "id": "doc2",
    "title": "Nachtrag RSTA — Prämienzuständigkeit",
    "recipient": "RSTA",
    "status": "blocked",
    "date": "2026-07-21",
    "references": ["doc1"],
    "attachments": ["Assura Mahnstopp-Antrag"],
    "summary": "Nachtrag zur Aufsichtsbeschwerde betreffend Zuständigkeit für Krankenkassenprämien. Wartet auf Bestätigung der Assura-Stundung, bevor Nachtrag final abgeschickt wird."
  },
  {
    "id": "doc3",
    "title": "Assura Mahnstopp/Stundung",
    "recipient": "privat",
    "status": "sent",
    "date": "2026-07-18",
    "references": [],
    "attachments": [],
    "summary": "Antrag an Assura auf Zahlungsaufschub, via Proton Mail versendet. Grundlage für Nachtrag RSTA (doc2)."
  },
  {
    "id": "doc4",
    "title": "V6 Forderung MüB",
    "recipient": "MüB",
    "status": "ready",
    "date": "2026-07-15",
    "references": ["doc5"],
    "attachments": ["E-Mail Corinne Klaey 08.05."],
    "summary": "Korrigierte Forderung CHF 1'853.40 an Sozialdienst Münchenbuchsee. Ersetzt defekte V5. Stützt sich auf digital signierte E-Mail von Corinne Klaey als Kernbeweis gegen rückwirkende Anrechnung des Märzlohns."
  },
  {
    "id": "doc5",
    "title": "V5 (defekt, nicht wiederverwenden)",
    "recipient": "MüB",
    "status": "blocked",
    "date": "2026-05-20",
    "references": [],
    "attachments": [],
    "summary": "Ursprüngliche Forderungsversion mit Berechnungsfehler. Nicht mehr verwenden — nur als Referenz für V6 relevant."
  },
  {
    "id": "doc6",
    "title": "Fall-Transfer MüB → Bern",
    "recipient": "MüB",
    "status": "draft",
    "date": "2026-08-01",
    "references": ["doc4"],
    "attachments": [],
    "summary": "Persönliche Anmeldung bei Einwohnerdienste Bern für Case-Transfer. 4–6 Wochen Bearbeitungszeit erwartet — Kollisionsrisiko mit offener V6-Forderung."
  },
  {
    "id": "doc7",
    "title": "AVA Sammelantwort",
    "recipient": "AVA",
    "status": "sent",
    "date": "2026-07-23",
    "references": ["doc8", "doc9"],
    "attachments": ["Entscheid Nr. 349983855", "Entscheid 4-Einstelltage"],
    "summary": "Konsolidierte Einsprache gegen zwei Einstelltage-Entscheide sowie Stellungnahme zu fehlendem Nachweis Stellensuche Juni. Adressiert an AVA Recht und Dienste, Bern."
  },
  {
    "id": "doc8",
    "title": "Einsprache 8 Einstelltage",
    "recipient": "AVA",
    "status": "sent",
    "date": "2026-07-01",
    "references": [],
    "attachments": [],
    "summary": "Einsprache gegen Entscheid Nr. 349983855 vom 01.07.2026."
  },
  {
    "id": "doc9",
    "title": "Einsprache 4 Einstelltage",
    "recipient": "AVA",
    "status": "sent",
    "date": "2026-07-23",
    "references": [],
    "attachments": [],
    "summary": "Einsprache gegen weiteren Einstelltage-Entscheid vom 23.07.2026."
  },
  {
    "id": "doc10",
    "title": "Berichtigung Konkurs-Eintrag",
    "recipient": "AVA",
    "status": "ready",
    "date": "2026-07-25",
    "references": [],
    "attachments": [],
    "summary": "Korrektur eines fehlerhaften 'Konkurs der Firma'-Eintrags, gestützt auf Art. 28/31 ATSG."
  },
  {
    "id": "doc11",
    "title": "Schlusserklärung (konditional)",
    "recipient": "Belp",
    "status": "draft",
    "date": "2026-08-01",
    "references": ["doc1", "doc4"],
    "attachments": [],
    "summary": "Ankündigt freiwilligen Ausstieg aus dem Sozialhilfesystem — bedingt durch gesicherte Mietzahlung. Hängt von Ausgang doc1 (Belp) und doc4 (MüB-Forderung) ab."
  }
]
;

let docsById = {};
let activeFilter = 'all';
let positions = {};

const STATUS_COLOR = {
  draft:   '#8a8578',
  ready:   '#c9a13a',
  sent:    '#3f6b62',
  blocked: '#c1443e'
};
const STATUS_LABEL = { draft:'Entwurf', ready:'Bereit', sent:'Gesendet', blocked:'Blockiert' };

function init(docs){
  docs.forEach(d => docsById[d.id] = d);
  const recipients = [...new Set(docs.map(d => d.recipient))];
  buildFilters(recipients);
  layoutByRecipient(docs, recipients);
  render();
}

function buildFilters(recipients){
  const container = document.getElementById('filters');
  container.appendChild(makeFilterBtn('Alle', 'all', true));
  recipients.forEach(r => container.appendChild(makeFilterBtn(r, r, false)));
}

function makeFilterBtn(label, value, active){
  const btn = document.createElement('button');
  btn.textContent = label;
  if (active) btn.classList.add('active');
  btn.onclick = () => {
    activeFilter = value;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  return btn;
}

// Simple deterministic layout: group nodes into columns by recipient,
// stack vertically within each column.
function layoutByRecipient(docs, recipients){
  const colWidth = 220;
  const rowHeight = 90;
  const startX = 130;
  const startY = 90;

  recipients.forEach((r, colIdx) => {
    const docsInCol = docs.filter(d => d.recipient === r);
    docsInCol.forEach((d, rowIdx) => {
      positions[d.id] = {
        x: startX + colIdx * colWidth,
        y: startY + rowIdx * rowHeight,
        col: r
      };
    });
  });
}

function render(){
  const graph = document.getElementById('graph');
  graph.innerHTML = '';

  const visibleDocs = Object.values(docsById).filter(d =>
    activeFilter === 'all' || d.recipient === activeFilter
  );
  const visibleIds = new Set(visibleDocs.map(d => d.id));

  const maxX = Math.max(...Object.values(positions).map(p => p.x)) + 200;
  const maxY = Math.max(...Object.values(positions).map(p => p.y)) + 100;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', maxX);
  svg.setAttribute('height', maxY);
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);

  // Arrow marker def
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8578"></path>
  </marker>`;
  svg.appendChild(defs);

  // Column labels
  const seenCols = new Set();
  visibleDocs.forEach(d => {
    const pos = positions[d.id];
    if (!seenCols.has(pos.col)) {
      seenCols.add(pos.col);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', pos.x + 85);
      label.setAttribute('y', 40);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-family', 'JetBrains Mono, monospace');
      label.setAttribute('font-size', '11');
      label.setAttribute('fill', '#5a5648');
      label.setAttribute('letter-spacing', '1.5');
      label.textContent = pos.col.toUpperCase();
      svg.appendChild(label);
    }
  });

  // Edges (only between visible nodes)
  visibleDocs.forEach(d => {
    (d.references || []).forEach(refId => {
      if (visibleIds.has(refId) && positions[refId]) {
        const from = positions[refId];
        const to = positions[d.id];
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = from.x + 85, y1 = from.y + 30;
        const x2 = to.x + 85, y2 = to.y;
        const midY = (y1 + y2) / 2;
        path.setAttribute('d', `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`);
        path.setAttribute('stroke', '#8a8578');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('opacity', '0.7');
        path.setAttribute('marker-end', 'url(#arrow)');
        svg.appendChild(path);
      }
    });
  });

  // Nodes
  visibleDocs.forEach(d => {
    const pos = positions[d.id];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    g.style.cursor = 'pointer';
    g.onclick = () => showDetail(d.id);

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', '170');
    rect.setAttribute('height', '54');
    rect.setAttribute('rx', '2');
    rect.setAttribute('fill', STATUS_COLOR[d.status]);
    rect.setAttribute('stroke', '#201d17');
    rect.setAttribute('stroke-width', '1.5');
    g.appendChild(rect);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', '10');
    text.setAttribute('y', '22');
    text.setAttribute('font-family', "'Source Serif 4', serif");
    text.setAttribute('font-size', '12.5');
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', '#f2ede2');
    wrapText(text, d.title, 150, 15);
    g.appendChild(text);

    const dateText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    dateText.setAttribute('x', '10');
    dateText.setAttribute('y', '46');
    dateText.setAttribute('font-family', 'JetBrains Mono, monospace');
    dateText.setAttribute('font-size', '9.5');
    dateText.setAttribute('fill', '#f2ede2');
    dateText.setAttribute('opacity', '0.85');
    dateText.textContent = d.date;
    g.appendChild(dateText);

    svg.appendChild(g);
  });

  graph.appendChild(svg);
}

function wrapText(textEl, str, maxWidth, lineHeight){
  const words = str.split(' ');
  let line = '';
  let lines = [];
  const approxCharWidth = 6.3;
  const maxChars = Math.floor(maxWidth / approxCharWidth);

  words.forEach(w => {
    if ((line + ' ' + w).trim().length > maxChars) {
      lines.push(line.trim());
      line = w;
    } else {
      line = (line + ' ' + w).trim();
    }
  });
  if (line) lines.push(line);
  lines = lines.slice(0, 2);

  lines.forEach((l, i) => {
    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    tspan.setAttribute('x', '10');
    tspan.setAttribute('dy', i === 0 ? '0' : lineHeight);
    tspan.textContent = l;
    textEl.appendChild(tspan);
  });
}

function showDetail(id){
  const d = docsById[id];
  const sidebar = document.getElementById('sidebar');

  const refsHtml = (d.references || []).length
    ? `<ul>${d.references.map(r => `<li onclick="showDetail('${r}')">${docsById[r] ? docsById[r].title : r}</li>`).join('')}</ul>`
    : `<p style="color:#8a8578; font-style:italic;">Keine Referenzen.</p>`;

  const attHtml = (d.attachments || []).length
    ? `<ul>${d.attachments.map(a => `<li style="cursor:default;">${a}</li>`).join('')}</ul>`
    : `<p style="color:#8a8578; font-style:italic;">Keine Beilagen erfasst.</p>`;

  sidebar.innerHTML = `
    <div class="doc-title">${d.title}</div>
    <div class="doc-meta">${d.recipient} · ${d.date}</div>
    <div class="doc-status ${d.status}">${STATUS_LABEL[d.status]}</div>
    <div class="doc-section">
      <h3>Zusammenfassung</h3>
      <p>${d.summary}</p>
    </div>
    <div class="doc-section">
      <h3>Referenziert</h3>
      ${refsHtml}
    </div>
    <div class="doc-section">
      <h3>Beilagen</h3>
      ${attHtml}
    </div>
    <div class="legend">
      <div><span class="dot" style="background:#3f6b62;"></span> Gesendet</div>
      <div><span class="dot" style="background:#c9a13a;"></span> Bereit</div>
      <div><span class="dot" style="background:#8a8578;"></span> Entwurf</div>
      <div><span class="dot" style="background:#c1443e;"></span> Blockiert</div>
    </div>
  `;
}


init(EMBEDDED_DOCS);
  </script>
</body>
</html>

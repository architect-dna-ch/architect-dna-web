<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats · Muharrem</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAFAF8;--border:#E0E0D8;--text:#1A1A1A;--text2:#5A5A58;--red:#B5271E;--mono:'SF Mono','Fira Code','Courier New',monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121211;--border:#2C2C29;--text:#ECEBE6;--text2:#A9A8A2;--red:#D9472F}}
html{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.5}
body{max-width:620px;margin:0 auto;padding:40px 20px}
h1{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.m{color:var(--text2);font-size:12px;margin-bottom:24px}
input{font-family:var(--mono);font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);width:60%}
button{font-family:var(--mono);font-size:14px;font-weight:700;padding:10px 16px;border:1px solid var(--red);background:var(--red);color:#fff;border-radius:8px;cursor:pointer;margin-left:6px}
.big{display:flex;gap:16px;margin:24px 0;flex-wrap:wrap}
.card{border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:120px}
.card .n{font-size:30px;font-weight:900}
.card .l{font-size:11px;letter-spacing:.1em;color:var(--text2);text-transform:uppercase;margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
th{font-size:11px;letter-spacing:.08em;color:var(--text2);text-transform:uppercase}
.bar{height:6px;background:var(--red);border-radius:3px;display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<h1>Seiten-Statistik</h1>
<div class="m">Nur Zahlen, keine Cookies, keine IPs. Nur für dich.</div>
<div><input id="k" type="password" placeholder="Schlüssel"><button onclick="load()">Zeigen</button></div>
<div id="out"></div>
<script>
function fmt(ms){ const s=Math.round(ms/1000); if(s<60)return s+' s'; return Math.floor(s/60)+' min '+(s%60)+' s'; }
async function load(){
  const k = document.getElementById('k').value.trim();
  const out = document.getElementById('out');
  out.innerHTML = '<div class="m">Lade …</div>';
  let d;
  try { const r = await fetch('/api/track?stats=' + encodeURIComponent(k)); if(!r.ok){ out.innerHTML='<div class="m">Falscher Schlüssel.</div>'; return; } d = await r.json(); }
  catch(e){ out.innerHTML='<div class="m">Fehler.</div>'; return; }
  const imgs = d.images || {};
  const avg = d.sessions ? d.pageMs/d.sessions : 0;
  let maxClicks = 1; Object.values(imgs).forEach(v=>maxClicks=Math.max(maxClicks,v.clicks||0));
  let rows='';
  for(let i=1;i<=12;i++){ const v=imgs[i]||{clicks:0,dwellMs:0,dwellN:0}; const dw=v.dwellN?v.dwellMs/v.dwellN:0;
    rows += '<tr><td>#'+i+'</td><td>'+(v.clicks||0)+' <span class="bar" style="width:'+Math.round((v.clicks||0)/maxClicks*90)+'px"></span></td><td>'+(dw?fmt(dw):'–')+'</td></tr>'; }
  out.innerHTML =
    '<div class="big">'
    + '<div class="card"><div class="n">'+(d.views||0)+'</div><div class="l">Besuche</div></div>'
    + '<div class="card"><div class="n">'+(d.sessions||0)+'</div><div class="l">Sessions</div></div>'
    + '<div class="card"><div class="n">'+fmt(avg)+'</div><div class="l">Ø Verweildauer</div></div>'
    + '</div>'
    + '<table><tr><th>Bild</th><th>Klicks</th><th>Ø angeschaut</th></tr>'+rows+'</table>';
}
</script>
</body>
</html>

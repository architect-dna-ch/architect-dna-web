<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Dossier — Dashboard</title>
<style>
:root{
  --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
  --paper:#f2ede2; --paper-dark:#e8e0cf; --ink:#201d17; --ink-soft:#5a5648;
  --red:#a3231f; --gold:#8a6d1f; --teal:#2e4a44; --grey:#8a8578; --line:#c9beaa;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-serif); min-height:100vh;}
header{border-bottom:3px double var(--ink); padding:20px 24px 14px;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-soft); text-transform:uppercase;}
h1{font-size:28px; font-weight:700; margin-top:2px;}
h1 span{color:var(--red);}
.toolbar{display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--paper-dark);}
.toolbar .count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.toolbar button{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:8px 14px; cursor:pointer;}
.toolbar button:disabled{opacity:0.35; cursor:not-allowed;}
table{width:100%; border-collapse:collapse;}
th{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); text-align:left; padding:10px 24px; border-bottom:1px solid var(--line);}
td{padding:14px 24px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
tr:hover{background:rgba(0,0,0,0.02);}
td.checkbox-cell{width:30px;}
.company{font-weight:700;}
.stamp{display:inline-block; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:4px 9px; border:2px solid; transform:rotate(-2deg);}
.stamp.overdue{color:var(--red); border-color:var(--red);}
.stamp.pending{color:var(--gold); border-color:var(--gold);}
.stamp.draft{color:var(--grey); border-color:var(--grey); transform:rotate(0);}
.stamp.done{color:var(--teal); border-color:var(--teal);}
.deadline{font-family:var(--font-mono); font-size:12px;}
.deadline.overdue{color:var(--red); font-weight:700;}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Privacy Dossier · Dashboard</div>
  <h1>Meine <span>Anfragen</span></h1>
</header>
<div class="toolbar">
  <div class="count" id="selCount">0 ausgewählt</div>
  <button id="bulkSend" disabled>Ausgewählte senden</button>
</div>
<table>
  <thead>
    <tr>
      <th class="checkbox-cell"><input type="checkbox" id="selectAll"></th>
      <th>Firma</th><th>Anfrageart</th><th>Status</th><th>Frist</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const DATA = [
  {company:'Sovendus GmbH', type:'Auskunft (Art. 25 DSG)', status:'overdue', deadline:'2026-07-20'},
  {company:'SiteGround Hosting', type:'Löschung (Art. 32 DSG)', status:'pending', deadline:'2026-08-10'},
  {company:'PostFinance AG', type:'Auskunft (Art. 25 DSG)', status:'pending', deadline:'2026-08-15'},
  {company:'Zalando SE', type:'Widerspruch (Art. 21 DSGVO)', status:'draft', deadline:''},
  {company:'Digitec Galaxus AG', type:'Löschung (Art. 17 DSGVO)', status:'done', deadline:''},
];
const STAMP_LABEL = {overdue:'Frist überschritten', pending:'Unterwegs', draft:'Entwurf bereit', done:'Erledigt'};

function daysUntil(d){ if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d+'T00:00:00')-t)/86400000); }

function render(){
  const tbody = document.getElementById('rows');
  tbody.innerHTML = DATA.map((r,i) => {
    const days = daysUntil(r.deadline);
    const overdue = days !== null && days < 0;
    return `<tr>
      <td class="checkbox-cell"><input type="checkbox" class="rowsel" data-i="${i}"></td>
      <td class="company">${r.company}</td>
      <td>${r.type}</td>
      <td><span class="stamp ${r.status}">${STAMP_LABEL[r.status]}</span></td>
      <td class="deadline ${overdue?'overdue':''}">${r.deadline || '—'}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.rowsel').forEach(cb => cb.onchange = updateCount);
}

function updateCount(){
  const n = document.querySelectorAll('.rowsel:checked').length;
  document.getElementById('selCount').textContent = n + ' ausgewählt';
  document.getElementById('bulkSend').disabled = n === 0;
}

document.getElementById('selectAll').onchange = (e) => {
  document.querySelectorAll('.rowsel').forEach(cb => cb.checked = e.target.checked);
  updateCount();
};
document.getElementById('bulkSend').onclick = () => alert('Demo: würde ' + document.querySelectorAll('.rowsel:checked').length + ' Anfrage(n) versenden.');

render();
</script>
</body>
</html>

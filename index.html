<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
(function(){var m={'gridfal.architect-dna.ch':'/gridfal/play.html','sprint.architect-dna.ch':'/sprint/play.html','fly.architect-dna.ch':'/fly/play.html','calm.architect-dna.ch':'/calm/app.html','clyedo.architect-dna.ch':'/clyedo/app.html','mission.architect-dna.ch':'/velo-noir/',};var d=m[location.hostname];if(d)location.replace(d);})();
</script>
<title>Architect-DNA Systems</title>
<meta name="description" content="Home UI design for Android — launchers, home screens and lock screens. Bern, Switzerland.">
<meta property="og:title" content="Architect-DNA Systems">
<meta property="og:description" content="Home UI design for Android. Bern, Switzerland.">
<meta name="theme-color" content="#F5F1E8">
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#F5F1E8; --ink:#1B1613; --ink2:#6A5F54; --ink3:#A99E8E;
  --line:#E2D9C8; --card:#FBF8F1; --accent:#B24A2E;
  --font:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',sans-serif;
  --mono:'SF Mono','Fira Code','Courier New',monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#14110E; --ink:#EDE7DA; --ink2:#ADA293; --ink3:#6E6456;
  --line:#2E2820; --card:#1E1A16; --accent:#C85E3E; color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
}
.wrap{
  width:100%; max-width:1080px;
  display:grid; grid-template-columns:1.1fr .9fr; align-items:center;
  gap:clamp(24px,5vw,72px);
}
/* ── left: the one offer ── */
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
h1{
  font-size:clamp(34px,6.2vw,66px); font-weight:900; letter-spacing:-.045em;
  line-height:.98; margin:16px 0 0; text-wrap:balance;
}
h1 .a{color:var(--accent)}
.lead{margin-top:clamp(14px,2.2vh,22px);font-size:clamp(14px,1.7vw,17px);line-height:1.55;color:var(--ink2);max-width:40ch}
.cta{margin-top:clamp(20px,3vh,30px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--bg);text-decoration:none;
  font-weight:800;font-size:14px;letter-spacing:.01em;
  padding:13px 20px;border-radius:9px;transition:transform .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-1px);background:var(--accent)}
.mail{font-family:var(--mono);font-size:12.5px;color:var(--ink2);text-decoration:none;letter-spacing:.02em}
.mail:hover{color:var(--accent)}
.meta{margin-top:clamp(18px,3vh,30px);font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
/* ── right: the thing itself, an Android home ── */
.stage{display:flex;justify-content:center}
.phone{
  width:min(260px,62vw); aspect-ratio:9/19.5; max-height:82vh;
  background:var(--card); border:1px solid var(--line);
  border-radius:30px; padding:16px 14px;
  display:flex; flex-direction:column; gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.pstat{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.pstat .dots{display:flex;gap:4px}
.pstat .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink3);display:block}
.clock{font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:6px}
.greet{font-size:12px;color:var(--ink2);margin-top:-2px}
.search{margin-top:6px;height:34px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--ink3);font-family:var(--mono)}
.grid{margin-top:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tile{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.tile span{width:46%;height:46%;border-radius:6px;background:var(--ink);opacity:.82}
.tile.ac span{background:var(--accent);opacity:1}
.spacer{flex:1}
.dock{display:flex;justify-content:space-between;padding:0 6px 2px}
.dock i{width:38px;height:38px;border-radius:11px;background:var(--line);display:block}
.dock i.ac{background:var(--accent)}
@media(max-width:720px){
  html,body{overflow:hidden}
  .wrap{grid-template-columns:1fr;gap:clamp(18px,3.5vh,30px);max-width:420px;text-align:center}
  .lead{margin-left:auto;margin-right:auto}
  .cta{justify-content:center}
  .stage{order:-1}
  .phone{width:min(168px,44vw);max-height:40vh;border-radius:24px;padding:12px 10px;gap:9px}
  .clock{font-size:34px}
  .grid{grid-template-columns:repeat(4,1fr);gap:7px}
}
@media(max-height:560px) and (max-width:720px){
  .stage{display:none}
  .wrap{max-width:460px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="intro">
    <div class="eyebrow">Architect-DNA · Bern</div>
    <h1>Home&nbsp;UI design<br>for <span class="a">Android</span>.</h1>
    <p class="lead">Launchers, home screens and lock screens — designed as carefully as the apps they hold. One studio, one craft.</p>
    <div class="cta">
      <a class="btn" href="mailto:systems@architect-dna.ch?subject=Android%20home%20UI">Start a project →</a>
      <a class="mail" href="mailto:systems@architect-dna.ch">systems@architect-dna.ch</a>
    </div>
    <div class="meta">Bern, Switzerland — remote worldwide</div>
  </section>

  <section class="stage" aria-hidden="true">
    <div class="phone">
      <div class="pstat"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
      <div class="clock">9:41</div>
      <div class="greet">Guten Morgen.</div>
      <div class="search">Suchen …</div>
      <div class="grid">
        <div class="tile"><span></span></div>
        <div class="tile ac"><span></span></div>
        <div class="tile"><span></span></div>
        <div class="tile"><span></span></div>
        <div class="tile"><span></span></div>
        <div class="tile"><span></span></div>
        <div class="tile"><span></span></div>
        <div class="tile"><span></span></div>
      </div>
      <div class="spacer"></div>
      <div class="dock"><i></i><i class="ac"></i><i></i><i></i></div>
    </div>
  </section>
</main>
</body>
</html>

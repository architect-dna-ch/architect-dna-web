<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Lens</title>
<meta name="description" content="ARC Lens — Kamera drauf halten, fragen. Erklärt, löst Schritt für Schritt, prüft deine Lösung.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#F4F1EC;--ink2:#B9B4AC;--ink3:#7D7871;--rust:#E0573B;--glass:rgba(18,16,14,.78);--line:rgba(255,255,255,.12);
--font:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',sans-serif;--mono:'SF Mono','Fira Code',monospace}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#cam,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#still{display:none}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  background:linear-gradient(#000a,#0000)}
.eye{font:700 11px/1 var(--mono);letter-spacing:.22em;color:var(--rust)}
.spacer{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center}
#hint{position:absolute;left:16px;right:16px;top:42%;text-align:center;color:var(--ink2);font-size:15px;line-height:1.5;display:none}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:linear-gradient(#0000,#000c 30%)}
.wrap{max-width:720px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:18px;padding:9px 13px;font:600 13.5px var(--font);cursor:pointer;backdrop-filter:blur(8px)}
.chip.on{background:var(--ink);color:#111}
.row{display:flex;align-items:center;gap:10px}
.ask{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:24px;padding:13px 16px;font:15px var(--font);backdrop-filter:blur(8px);min-width:0}
.ask::placeholder{color:var(--ink3)}
#shutter{width:66px;height:66px;border-radius:50%;border:4px solid rgba(255,255,255,.55);background:var(--ink);cursor:pointer;flex:none}
#shutter:disabled{opacity:.45}
/* answer sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;display:none;flex-direction:column;
  background:#141210;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px)}
#sheet.open{display:flex}
.grab{width:38px;height:4px;border-radius:3px;background:#3a3631;margin:0 auto 8px}
#thread{overflow-y:auto;padding:4px 18px 10px;flex:1}
.q{color:var(--ink3);font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.a{font-size:15.5px;line-height:1.6;color:var(--ink);overflow-x:auto}
.a b{color:#fff}
.a ul{padding-left:18px;margin:4px 0}
.a .katex-display{margin:.6em 0;overflow-x:auto;overflow-y:hidden}
.thinking{color:var(--ink2);font-size:14px}
.thinking::after{content:'';display:inline-block;width:1em;animation:dots 1.2s steps(4) infinite;text-align:left}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.err{color:#ff8a73}
.sheet-row{display:flex;gap:8px;padding:8px 16px 0}
.btn{border:0;border-radius:22px;padding:12px 15px;font:700 14px var(--font);cursor:pointer;flex:none}
.btn.light{background:var(--ink);color:#111}.btn.ghost{background:#24211d;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline autoplay muted></video>
  <img id="still" alt="">
  <div class="top">
    <span class="eye">— ARC · LENS</span><span class="spacer"></span>
    <button class="ibtn" id="pick" title="Foto wählen" aria-label="Foto wählen">🖼</button>
    <button class="ibtn" id="flip" title="Kamera wechseln" aria-label="Kamera wechseln">⟲</button>
  </div>
  <div id="hint"></div>
  <input type="file" id="file" accept="image/*" class="sr">

  <div class="dock" id="dock"><div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input class="ask" id="ask" placeholder="Frag etwas zum Bild …" enterkeyhint="send" autocomplete="off">
      <button id="shutter" aria-label="Foto machen und fragen"></button>
    </div>
  </div></div>

  <div id="sheet"><div class="grab"></div>
    <div id="thread"></div>
    <div class="sheet-row wrap" style="width:100%">
      <input class="ask" id="follow" placeholder="Nachfragen …" enterkeyhint="send" autocomplete="off">
      <button class="btn light" id="send">Fragen</button>
    </div>
    <div class="sheet-row wrap" style="width:100%">
      <button class="btn ghost" id="again" style="flex:1">📷 Neues Foto</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), still = $('still'), hint = $('hint'), sheet = $('sheet'), thread = $('thread');
  const PROMPTS = [
    ['Erklär das', 'Erklär mir, was hier zu sehen ist — kurz und verständlich.'],
    ['Schritt für Schritt lösen', 'Löse die Aufgabe Schritt für Schritt.'],
    ['Meine Lösung prüfen', 'Prüfe meine handschriftliche Lösung. Ist sie richtig? Wenn nicht: in welcher Zeile ist der Fehler und warum?'],
    ['Übersetzen', 'Übersetze den Text im Bild ins Deutsche.'],
    ['Was ist das?', 'Was ist das? Kurz.'],
  ];
  let chosen = null, facing = 'environment', stream = null, image = null, history = [], busy = false;

  // quick prompts
  for (const [label, text] of PROMPTS) {
    const c = document.createElement('button'); c.className = 'chip'; c.textContent = label;
    c.onclick = () => { const on = chosen !== text; chosen = on ? text : null;
      document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); if (on) c.classList.add('on'); };
    $('chips').append(c);
  }

  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      cam.srcObject = stream; hint.style.display = 'none';
    } catch (e) {
      stream = null; hint.style.display = 'block';
      hint.textContent = 'Keine Kamera verfügbar oder nicht erlaubt. Tippe oben auf 🖼, um ein Foto zu wählen.';
    }
  }

  // one frame → JPEG, longest side ≤ 1280 px (sharp enough to read handwriting, small enough to send fast)
  function frameFrom(src, w, h) {
    const s = Math.min(1, 1280 / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  }

  function freeze(dataUrl) {
    image = dataUrl; history = []; thread.replaceChildren();
    still.src = dataUrl; still.style.display = 'block';
    $('dock').style.display = 'none'; sheet.classList.add('open');
  }

  function unfreeze() {
    image = null; history = []; still.style.display = 'none'; sheet.classList.remove('open');
    $('dock').style.display = ''; $('ask').value = ''; chosen = null;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  }

  // Escape everything, keep $…$ / $$…$$ untouched for KaTeX, light markdown elsewhere.
  function render(text) {
    const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const md = s => esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>')
      .replace(/(^|\n)[ \t]*[-•][ \t]+/g, '$1• ')
      .replace(/\n/g, '<br>');
    return text.split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g).map((part, i) => i % 2 ? esc(part) : md(part)).join('');
  }

  function addTurn(q) {
    const qd = document.createElement('div'); qd.className = 'q'; qd.textContent = q;
    const ad = document.createElement('div'); ad.className = 'a thinking'; ad.textContent = 'Schaue mir das an';
    thread.append(qd, ad); thread.scrollTop = thread.scrollHeight;
    return ad;
  }

  async function ask(question) {
    if (busy || !image) return;
    busy = true; $('send').disabled = true;
    const q = (question || '').trim() || 'Was siehst du? Erklär es kurz.';
    const ad = addTurn(q);
    try {
      const r = await fetch('/api/lens', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image, question: q, history }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.answer) throw new Error(d.error === 'not configured' ? 'Der KI-Schlüssel ist auf dem Server nicht eingerichtet.' : 'Die KI ist gerade nicht erreichbar. Nochmals versuchen?');
      ad.className = 'a'; ad.innerHTML = render(d.answer);
      if (window.renderMathInElement) try { renderMathInElement(ad, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {}
      history.push({ q, a: d.answer });
    } catch (e) {
      ad.className = 'a err'; ad.textContent = navigator.onLine ? e.message : 'Offline — kein Netz.';
    }
    thread.scrollTop = thread.scrollHeight;
    busy = false; $('send').disabled = false;
  }

  function shoot() {
    if (!stream || !cam.videoWidth) { $('file').click(); return; }
    const q = $('ask').value.trim() || chosen || '';
    freeze(frameFrom(cam, cam.videoWidth, cam.videoHeight));
    ask(q);
  }

  $('shutter').onclick = shoot;
  $('ask').addEventListener('keydown', e => { if (e.key === 'Enter') shoot(); });
  $('send').onclick = () => { const v = $('follow').value; $('follow').value = ''; ask(v); };
  $('follow').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
  $('again').onclick = unfreeze;
  $('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
  $('pick').onclick = () => $('file').click();
  $('file').onchange = () => {
    const f = $('file').files && $('file').files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { const q = $('ask').value.trim() || chosen || ''; freeze(frameFrom(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); ask(q); };
    img.src = URL.createObjectURL(f); $('file').value = '';
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } else if (!document.hidden && !stream) startCam(); });
  startCam();
})();
</script>
</body>
</html>
